<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#217346" opacity="0.1"/>
  
  <!-- Excel Document Base -->
  <rect x="16" y="12" width="28" height="36" rx="2" fill="#217346"/>
  <rect x="18" y="14" width="24" height="32" rx="1" fill="#33A653"/>
  
  <!-- Excel Grid Lines -->
  <line x1="18" y1="20" x2="42" y2="20" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <line x1="18" y1="26" x2="42" y2="26" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <line x1="18" y1="32" x2="42" y2="32" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <line x1="18" y1="38" x2="42" y2="38" stroke="white" stroke-width="0.5" opacity="0.6"/>
  
  <line x1="26" y1="14" x2="26" y2="46" stroke="white" stroke-width="0.5" opacity="0.6"/>
  <line x1="34" y1="14" x2="34" y2="46" stroke="white" stroke-width="0.5" opacity="0.6"/>
  
  <!-- "X" Letter on Excel -->
  <text x="30" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">X</text>
  
  <!-- Magnifying Glass (Watcher Symbol) -->
  <circle cx="44" cy="44" r="8" fill="#1A5A32" stroke="#0D3D1F" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="6" fill="none" stroke="white" stroke-width="2"/>
  
  <!-- Magnifying Glass Handle -->
  <line x1="49.5" y1="49.5" x2="54" y2="54" stroke="#0D3D1F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="49.5" y1="49.5" x2="54" y2="54" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Eye inside Magnifying Glass (optional detail) -->
  <ellipse cx="44" cy="44" rx="3" ry="2" fill="white" opacity="0.8"/>
  <circle cx="44" cy="44" r="1" fill="#1A5A32"/>
</svg>